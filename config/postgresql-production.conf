# GirlsPreneur Production Database Configuration
# PostgreSQL configuration optimized for production workload

# CONNECTIONS AND AUTHENTICATION
# - Connection Settings -
listen_addresses = 'localhost'          # what IP address(es) to listen on;
                                        # comma-separated list of addresses;
                                        # defaults to 'localhost'; use '*' for all
                                        # (change requires restart)
port = 5432                             # (change requires restart)
max_connections = 100                   # (change requires restart)
superuser_reserved_connections = 3       # (change requires restart)
unix_socket_directories = '/var/run/postgresql' # comma-separated list of directories

# - Security -
authentication_timeout = 1min            # 1s-600s
ssl = on                                # (change requires restart)
ssl_ca_file = '/etc/ssl/certs/ca-certificates.crt'
ssl_cert_file = '/etc/letsencrypt/live/girlspreneur.com/fullchain.pem'
ssl_key_file = '/etc/letsencrypt/live/girlspreneur.com/privkey.pem'

# RESOURCE USAGE (except WAL)
# - Memory -
shared_buffers = 256MB                  # min 128kB
                                        # (change requires restart)
huge_pages = try                        # on, off, or try
                                        # (change requires restart)
temp_buffers = 16MB                     # min 800kB
work_mem = 4MB                          # min 64kB
maintenance_work_mem = 64MB             # min 1MB
hash_mem_multiplier = 2.0                # 1-1000 multiplier for hash table work mem

# - Kernel Resource Usage -
max_files_per_process = 1000           # min 25
                                        # (change requires restart)
shared_preload_libraries = 'pg_stat_statements' # (change requires restart)

# WRITE-AHEAD LOG
# - Settings -
wal_level = replica                     # minimal, replica, or logical
                                        # (change requires restart)
fsync = on                              # flush data to disk for crash safety
                                        # (turning this off can cause
                                        # unrecoverable data corruption)
synchronous_commit = on                # synchronization level;
                                        # off, local, remote_write, remote_apply, or on
wal_compression = on                   # enable compression of full-page writes
wal_writer_delay = 200ms               # 1-10000 milliseconds
wal_writer_flush_after = 1MB           # in megabytes; 0 disables

# - Checkpoints -
checkpoint_timeout = 5min              # range 30s-1d
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9     # checkpoint target duration, 0.0 - 1.0
checkpoint_flush_after = 256kB         # in megabytes; 0 disables

# - Archiving -
archive_mode = on                     # enables archiving; off, or on
                                        # (change requires restart)
archive_command = 'gzip < %p > /var/backups/postgresql/archive/%f.gz'
                                        # command to use to archive a logfile segment
                                        # placeholders: %p = path of file to archive
                                        #               %f = file name only
                                        # e.g. 'test ! -f /mnt/server/archivedir/%f && cp %p /mnt/server/archivedir/%f'
archive_timeout = 60min               # force a logfile segment switch to occur after
                                        # the specified time; 0 disables

# REPLICATION
# - Sending Servers -
max_wal_senders = 3                    # max number of walsender processes
                                        # (change requires restart)
max_replication_slots = 3              # max number of replication slots
                                        # (change requires restart)
wal_keep_size = 128MB                 # in megabytes; 0 disables

# - Master Server -
synchronous_standby_names = ''        # standby servers that provide sync rep
                                        # comma-separated list of application_name
                                        # from standby(s); '*' = all

# QUERY TUNING
# - Planner Method Configuration -
enable_seqscan = on
enable_indexscan = on
enable_bitmapscan = on
enable_tidscan = on
enable_sort = on
enable_hashagg = on
enable_nestloop = on
enable_material = on
enable_mergejoin = on
enable_hashjoin = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_parallel_append = on
enable_parallel_hash = on
enable_partition_pruning = on

# - Planner Cost Constants -
seq_page_cost = 1.0                   # measured on an arbitrary scale
random_page_cost = 1.1                # same scale as above
cpu_tuple_cost = 0.01                 # same scale as above
cpu_index_tuple_cost = 0.005          # same scale as above
cpu_operator_cost = 0.0025            # same scale as above
parallel_tuple_cost = 0.1              # same scale as above
parallel_setup_cost = 1000.0          # same scale as above

# - Genetic Query Optimizer -
geqo = on
geqo_threshold = 12
geqo_effort = 5                       # range 1-10
geqo_pool_size = 0                    # selects default pool size
geqo_generations = 0                  # selects default # of generations
geqo_selection_bias = 2.0             # range 1.5-2.0
geqo_seed = 0.0                       # range 0.0-1.0

# - Other Planner Options -
default_statistics_target = 100       # range 1-10000
constraint_exclusion = partition      # on, off, or partition
cursor_tuple_fraction = 0.1           # range 0.0-1.0
from_collapse_limit = 8
join_collapse_limit = 8                # 1 disables collapsing of JOIN
                                        # clauses
plan_cache_mode = auto                # auto, force_generic_plan or
                                        # force_custom_plan

# REPORTING AND LOGGING
# - Where to Log -
log_destination = 'stderr'             # Valid values are combinations of
                                        # stderr, csvlog, syslog, and eventlog,
                                        # depending on platform.
logging_collector = on                # Enable capturing of stderr and csvlog
                                        # into log files. Required to be on for
                                        # csvlogs.
                                        # (change requires restart)
log_directory = 'log'                  # directory where log files are written,
                                        # can be absolute or relative to PGDATA
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log' # log file name pattern,
                                        # can include strftime() escapes
log_file_mode = 0600                  # creation mode for log files,
                                        # begin with 0 to use octal notation
log_rotation_age = 1d                 # Automatic rotation of logfiles will
                                        # happen after that time.  0 disables.
log_rotation_size = 100MB             # Automatic rotation of logfiles will
                                        # happen after that much log output.
                                        # 0 disables.

# - What to Log -
log_min_messages = warning            # values in order of decreasing detail:
                                        #   debug5
                                        #   debug4
                                        #   debug3
                                        #   debug2
                                        #   debug1
                                        #   info
                                        #   notice
                                        #   warning
                                        #   error
                                        #   log
                                        #   fatal
                                        #   panic

log_min_error_statement = error       # values in order of decreasing detail:
                                        #   debug5
                                        #   debug4
                                        #   debug3
                                        #   debug2
                                        #   debug1
                                        #   info
                                        #   notice
                                        #   warning
                                        #   error
                                        #   log
                                        #   fatal
                                        #   panic (effectively off)

log_min_duration_statement = 1000     # -1 is disabled, 0 logs all statements
                                        # and their durations, > 0 logs only
                                        # statements running at least this number
                                        # of milliseconds

log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = default         # terse, default, or verbose messages
log_hostname = on
log_line_prefix = '%m [%p] %q%u@%d '    # special values:
                                        #   %a = application name
                                        #   %u = user name
                                        #   %d = database name
                                        #   %r = remote host and port
                                        #   %h = remote host
                                        #   %p = process ID
                                        #   %t = timestamp without milliseconds
                                        #   %m = timestamp with milliseconds
                                        #   %n = timestamp with milliseconds (as a Unix epoch)
                                        #   %i = command tag
                                        #   %e = SQL state
                                        #   %c = session ID
                                        #   %l = session line number
                                        #   %s = session start timestamp
                                        #   %v = virtual transaction ID
                                        #   %x = transaction ID (0 if none)
                                        #   %q = stop here in non-session
                                        #        processes
                                        #   %% = '%'
                                        # e.g. '<%u%%%d> '
log_lock_waits = on                    # log lock waits >= deadlock_timeout
log_statement = 'ddl'                 # none, ddl, mod, all
log_replication_commands = on
log_temp_files = 0                    # log temporary files equal or larger than
                                        # the specified size in kilobytes;
                                        # -1 disables, 0 logs all temp files
log_timezone = 'UTC'

# PROCESS TITLE
cluster_name = 'girlspreneur'          # added to process titles if nonempty
                                        # (change requires restart)
update_process_title = on

# STATISTICS
# - Query and Index Statistics Collector -
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all                 # none, pl, all
track_activity_query_size = 1MB       # (change requires restart)
stats_temp_directory = 'pg_stat_tmp'  # (change requires restart)

# - Monitoring -
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off
log_statement_stats = off

# AUTOVACUUM
autovacuum = on                        # Enable autovacuum subprocess?  'on'
                                        # requires track_counts to also be on.
autovacuum_max_workers = 3            # max number of autovacuum subprocesses
                                        # (change requires restart)
autovacuum_naptime = 1min             # time between autovacuum runs
autovacuum_vacuum_threshold = 50      # min number of row updates before
                                        # vacuum
autovacuum_analyze_threshold = 50     # min number of row updates before
                                        # analyze
autovacuum_vacuum_scale_factor = 0.2   # fraction of table size before vacuum
autovacuum_analyze_scale_factor = 0.1  # fraction of table size before analyze
autovacuum_freeze_max_age = 200000000 # maximum XID age before forced vacuum
                                        # (change requires restart)
autovacuum_multixact_freeze_max_age = 400000000        # maximum multixact age
                                        # before forced vacuum
                                        # (change requires restart)
autovacuum_vacuum_cost_delay = 20ms     # default vacuum cost delay for
                                        # autovacuum, in milliseconds;
                                        # -1 means use vacuum_cost_delay
autovacuum_vacuum_cost_limit = 2000   # default vacuum cost limit for
                                        # autovacuum, -1 means use
                                        # vacuum_cost_limit

# CLIENT CONNECTION DEFAULTS
# - Statement Behavior -
search_path = '"$user", public'        # schema names
default_table_access_method = heap
row_security = on

# - Locale and Formatting -
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
timezone = 'UTC'
timezone_abbreviations = 'Default'     # Select the set of available time zone
                                        # abbreviations.  Currently, there are
                                        #   Default
                                        #   Australia (historical usage)
                                        #   India
                                        # You can create your own file in
                                        # share/timezonesets/.
extra_float_digits = 1                # number of extra float digits, for
                                        # wavy float output, -15..15
client_encoding = UTF8                # actually, defaults to database
                                        # encoding

# These settings are initialized by initdb, but they can be changed.
lc_messages = 'en_US.UTF-8'                     # locale for system error message
                                        # strings
lc_monetary = 'en_US.UTF-8'                     # locale for monetary formatting
lc_numeric = 'en_US.UTF-8'                      # locale for number formatting
lc_time = 'en_US.UTF-8'                         # locale for time formatting

# default configuration for text search
default_text_search_config = 'pg_catalog.english'

# - Shared Library Preloading -
local_preload_libraries = ''
session_preload_libraries = ''

# - Other Defaults -
dynamic_library_path = '$libdir'
jit_provider = 'llvmjit'               # JIT library to use

# LOCK MANAGEMENT
deadlock_timeout = 1s
max_locks_per_transaction = 64         # min 10
                                        # (change requires restart)
max_pred_locks_per_transaction = 64   # min 10
                                        # (change requires restart)
max_pred_locks_per_relation = -2       # negative values mean
                                        # (max_pred_locks_per_transaction
                                        #  / -max_pred_locks_per_relation) - 1
max_pred_locks_per_page = 2            # min 0

# VERSION AND PLATFORM COMPATIBILITY
# - Previous PostgreSQL Versions -
array_nulls = on
backslash_quote = safe_encoding        # on, off, or safe_encoding
default_with_oids = off
escape_string_warning = on
lo_compat_privileges = off
operator_precedence_warning = off
quote_all_identifiers = off
standard_conforming_strings = on
synchronize_seqscans = on

# - Other Platforms and Clients -
transform_null_equals = off

# ERROR HANDLING
exit_on_error = off                    # terminate session on any error?
restart_after_crash = on               # reinitialize after backend crash?
data_sync_retry = off                  # retry or panic on failure to fsync
                                        # data files?
recovery_init_sync_method = fsync      # fsync, syncfs (Linux 5.8+)

# CONFIG FILE INCLUDES
include_dir = 'conf.d'                 # include files ending in '.conf' from
                                        # directory 'conf.d'
include_if_exists = 'exists.conf'      # include file only if it exists
include = 'custom.conf'                # include file

# CUSTOMIZED OPTIONS
# Add settings for extensions here

# Performance monitoring
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# Auto-explain configuration
auto_explain.log_min_duration = '1000'
auto_explain.log_analyze = true
auto_explain.log_buffers = true
auto_explain.log_timing = true
auto_explain.log_verbose = true
auto_explain.log_format = 'json'
auto_explain.log_nested_statements = true

# pg_stat_statements configuration
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
pg_stat_statements.save = on